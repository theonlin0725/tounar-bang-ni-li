app:
  description: 帮你理：招聘信息确认入账演示。LLM 只提取文本，真实 Jev 做字段/归属/状态核验；最终写入由帮你理服务端完成。
  icon: 🧭
  icon_background: '#E8F3EE'
  icon_type: emoji
  mode: workflow
  name: 帮你理-确认入账-LLM+Jev
  use_icon_as_answer_icon: false
dependencies: []
kind: app
site:
  chat_color_theme: null
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: zh-Hans
  description: null
  icon: 🧭
  icon_background: '#E8F3EE'
  icon_type: emoji
  input_placeholder: null
  privacy_policy: null
  show_workflow_steps: true
  title: 帮你理确认入账演示
  use_icon_as_answer_icon: false
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
